<!doctype html>
<html lang="en" data-theme="dark" data-tone="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  // The SlotForge theme before the first paint; src/app-theme.js owns it (as in Foundry).
  (function () {
    var root = document.documentElement,
      theme = 'dark',
      custom = null,
      legacy = null;
    try {
      legacy = localStorage.getItem('anvil.theme');
      var saved = JSON.parse(localStorage.getItem('slotforge.appearance.v1') || 'null');
      theme = (saved && saved.theme) || (legacy === 'light' ? 'light' : 'dark');
      custom = saved && saved.customColors;
    } catch (e) {}
    try {
      theme = new URL(location.href).searchParams.get('sfTheme') || theme;
    } catch (e) {}
    root.dataset.theme = theme;
    root.dataset.tone =
      theme === 'light' || theme === 'ocean' || (theme === 'custom' && legacy === 'light')
        ? 'light'
        : 'dark';
    if (theme === 'custom' && custom)
      for (var k in custom)
        if (/^#[0-9a-f]{6}$/i.test(custom[k])) root.style.setProperty('--' + k, custom[k]);
  })();
</script>
